name: Backend CI Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend_ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend_ci.yml'
  workflow_dispatch:

jobs:
  backend-tests:
    name: Python Compilation, Security & API Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (OpenCV & PyTorch Support)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libgomp1

      - name: Install Python Dependencies (CPU-Optimized)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt

      - name: 1. Python Syntax & Module Compilation Check
        run: |
          python -m compileall -q backend/app backend/models

      - name: 2. API Security Hardening Verification (CORS, Payload 413, Rate Limiter 429)
        run: |
          python backend/test_security_hardening.py

      - name: 3. API Integration Verification (Forecast & Condition Grader)
        run: |
          python backend/test_api_endpoints.py
