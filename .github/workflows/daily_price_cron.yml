name: Daily Pokemon Price Ingestion

on:
  schedule:
    # 00:00 UTC = 07:00 WIB setiap hari
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Mengizinkan eksekusi manual kapan pun dari tab Actions di GitHub

jobs:
  track-daily-prices:
    name: Sync Pokemon Prices to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ingestion Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests tqdm python-dotenv

      - name: Run Daily Price Tracker
        env:
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python backend/daily_price_tracker.py --workers 4
