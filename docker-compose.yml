version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: regokemon-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - RATE_LIMIT_AI_PER_MINUTE=60
      - ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
    volumes:
      # Mount folder model untuk kemudahan update bobot tanpa build ulang container
      - ./backend/models:/app/models:ro
      - ./backend/dataset:/app/dataset:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

